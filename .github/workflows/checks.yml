name: Status checks

on:
  schedule:
    # Every 5 minutes, off the hour marks: GitHub delays scheduled runs most at the top of the hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      registry:
        description: Run the daily MCP Registry check now
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'check/**'
      - 'site/index.html'
      - '.github/workflows/checks.yml'

# One run at a time, so two runs never push results over each other.
concurrency:
  group: status-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # commit the results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        if: github.event_name != 'schedule'
        run: node --test test/*.test.mjs
      - name: Run the checks
        env:
          PINCAST_TEST_KEY: ${{ secrets.PINCAST_TEST_KEY }}
          PINCAST_TEST_SET: ${{ vars.PINCAST_TEST_SET }}
          FORCE_DAILY: ${{ inputs.registry }}
        run: node check/run.mjs
      - name: Commit the results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Status results $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
